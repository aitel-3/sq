        DispPoint("SHMST",SHMST_P);
        if( SHMST_P < 1 ) {
            Disable("FRTGD");
            if( FRTGD_P > 0 ) { FRTGD_P = 0; statusValues.set(bar, 0); FRTGD_F(bar); }
            Disable("BCKGD");
            if( BCKGD_P > 0 ) { BCKGD_P = 0; statusValues.set(bar, 0); BCKGD_F(bar); }
        }
        if( SHMST_P >= 1 ) {
            Visible("FRTGD");
            Visible("BCKGD");
        }
        if( SHMST_P < 3 ) {
            Disable("FLLDF");
            if( FLLDF_P > 0 ) { FLLDF_P = 0; statusValues.set(bar, 0); FLLDF_F(bar); }
        }
        if( SHMST_P >= 3 && DFBST_P >= 3 ) {
            Visible("FLLDF");
        }
        if( SHMST_P < 5 ) {
            Disable("FIRGD");
            if( FIRGD_P > 0 ) { FIRGD_P = 0; statusValues.set(bar, 0); FIRGD_F(bar); }
            Disable("FRZGD");

            Disable("SHKGD");
            if( SHKGD_P > 0 ) { SHKGD_P = 0; statusValues.set(bar, 0); SHKGD_F(bar); }
        }
        if( SHMST_P >= 5 && TPBST_P >= 3 ) {
            Visible("FIRGD");
            Visible("FRZGD");
            Visible("SHKGD");
        }
        if( SHMST_P < 7 ) {
            Disable("AUTGD");
            if( AUTGD_P > 0 ) { AUTGD_P = 0; statusValues.set(bar, 0); AUTGD_F(bar); }
        }
        if( SHMST_P >= 7 && DFBST_P >= 7 ) {
            Visible("AUTGD");
        }
        if( SHMST_P < 10 ) { 
            Disable("SHDSM");
            if( SHDSM_P > 0 ) { SHDSM_P = 0; statusValues.set(bar, 0); SHDSM_F(bar); }
        }
        if( SHMST_P >= 10 && FLLDF_P >= 5 ) {
            Visible("SHDSM");
